<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menswear Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <h1 class="logo">Menswear</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="#products">Products</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
    <button id="cart-btn" class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <section class="hero">
    <h2>New Season, New Style</h2>
    <p>Shop the latest collection of men’s fashion.</p>
    <a href="#products" class="btn primary-btn">Shop Now</a>
  </section>

  <section id="products" class="product-section">
    <h2>Featured Products</h2>
    <div id="product-grid" class="product-grid">
      <!-- Products injected by script.js -->
    </div>
  </section>

  <footer>
    <p>&copy; <span id="year"></span> Menswear. All rights reserved.</p>
  </footer>

  <!-- Cart Modal -->
  <div id="cart-modal" class="cart-modal hidden">
    <div class="cart-content">
      <span id="close-cart" class="close">&times;</span>
      <h2>Your Cart</h2>
      <ul id="cart-items" class="cart-items"></ul>
      <p class="total">Total: $<span id="cart-total">0</span></p>
      <button id="checkout-btn" class="btn checkout-btn">Checkout</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
