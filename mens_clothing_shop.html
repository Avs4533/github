<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Men's Clothing Shop</title>
    <style>
        /* Basic styling */
        body {font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5;}
        header {background: #222; color: #fff; padding: 1rem 0;}
        nav ul {list-style: none; margin: 0; padding: 0; display: flex; gap: 1rem;}
        nav a {color: #fff; text-decoration: none; font-weight: bold;}
        .container {max-width: 1200px; margin: 0 auto; padding: 0 1rem;}
        .products {display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; margin: 2rem 0;}
        .card {background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); overflow: hidden;}
        .card img {width: 100%; display: block;}
        .card-content {padding: 1rem;}
        .card-content h3 {margin: 0 0 0.5rem;}
        .price {color: #007bff; font-weight: bold; margin-bottom: 0.5rem;}
        button {background: #007bff; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;}
        button:hover {background: #0056b3;}
        footer {background: #222; color: #fff; text-align: center; padding: 1rem; margin-top: 2rem;}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Men's Clothing Shop</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">T-Shirts</a></li>
                    <li><a href="#">Jeans</a></li>
                    <li><a href="#">Jackets</a></li>
                    <li><a href="#">Accessories</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="products">
            <div class="card">
                <img src="https://source.unsplash.com/featured/?mens,tshirt" alt="Classic T-Shirt">
                <div class="card-content">
                    <h3>Classic T-Shirt</h3>
                    <p class="price">$19.99</p>
                    <button>Add to Cart</button>
                </div>
            </div>
            <div class="card">
                <img src="https://source.unsplash.com/featured/?mens,jeans" alt="Slim Fit Jeans">
                <div class="card-content">
                    <h3>Slim Fit Jeans</h3>
                    <p class="price">$39.99</p>
                    <button>Add to Cart</button>
                </div>
            </div>
            <div class="card">
                <img src="https://source.unsplash.com/featured/?mens,jacket" alt="Leather Jacket">
                <div class="card-content">
                    <h3>Leather Jacket</h3>
                    <p class="price">$99.99</p>
                    <button>Add to Cart</button>
                </div>
            </div>
            <div class="card">
                <img src="https://source.unsplash.com/featured/?mens,shoes" alt="Stylish Sneakers">
                <div class="card-content">
                    <h3>Stylish Sneakers</h3>
                    <p class="price">$59.99</p>
                    <button>Add to Cart</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Men's Clothing Shop. All rights reserved.</p>
    </footer>
</body>
</html>
